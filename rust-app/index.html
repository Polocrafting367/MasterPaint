<script>
  // Résolution de rendu (Paramètres › Apparence, mode léger) : le moteur d'affichage lit l'échelle de
  // l'écran une fois, au démarrage. Le canevas garde sa taille à l'écran ; il a moins de pixels à
  // dessiner (temps par image divisé par 2 sur un écran à 150 %). Sans la taille en pixels réels
  // du canevas, le moteur calcule la sienne à partir de cette échelle.
  (() => {
    window.mpRealDpr = window.devicePixelRatio || 1;
    try {
      // jamais en dessous de 1 : l'interface entière deviendrait floue
      if (JSON.parse(localStorage.getItem('illu_rust_settings') || '{}').renderScale >= 1 && window.mpRealDpr > 1) {
        Object.defineProperty(window, 'devicePixelRatio', { get: () => 1, configurable: true });
        if (window.ResizeObserverEntry) delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
      }
    } catch (_) {}
  })();
</script>

<script>
  window.mpSetSystemTheme = (color, dark, accent) => {
    if (!/^#[0-9a-f]{6}$/i.test(color) || !/^#[0-9a-f]{6}$/i.test(accent)) return;
    document.querySelector('meta[name="theme-color"]').content = color;
    document.documentElement.classList.toggle('dark', !!dark);
    document.documentElement.style.setProperty('--mp-accent', accent);
    document.documentElement.style.setProperty('--mp-dialog-accent', color);
    document.documentElement.style.setProperty('--desk', color);
    document.documentElement.style.setProperty('--bg', dark ? '#1f1f1f' : '#cfcfcf');
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    try { localStorage.setItem('mp_system_theme', JSON.stringify({color, dark: !!dark, accent})); } catch (_) {}
  };
  try {
    const saved = JSON.parse(localStorage.getItem('illu_rust_settings') || '{}');
    const accent = /^#[0-9a-f]{6}$/i.test(saved.accent) ? saved.accent : '#0f766e';
    const cache = JSON.parse(localStorage.getItem('mp_system_theme') || 'null');
    const color = cache && cache.accent === accent && cache.dark === !!saved.dark
      ? cache.color : '#' + accent.slice(1).match(/../g).map(v => Math.round(parseInt(v,16)*0.62).toString(16).padStart(2,'0')).join('');
    window.mpSetSystemTheme(color, !!saved.dark, accent);
  } catch (_) {}
  // même page à la racine du site (masterpaint.fr/) et dans /rust-app/ : chemins relatifs à la racine
  window.MP_ROOT = /\/rust-app\/(index\.html)?$/.test(location.pathname) ? '../' : './';
  // images de démarrage de la version HTML, tirées au sort avec les mêmes poids
  (function () {
    const pics = [['IMG/start.png', 45], ['IMG/start1.png', 35], ['IMG/start2.png', 10], ['IMG/start3.png', 10]];
    let r = Math.random() * 100, src = pics[0][0];
    for (const [p, w] of pics) { if (r < w) { src = p; break; } r -= w; }
    document.getElementById('splash').src = MP_ROOT + src;
    document.querySelector('link[rel=icon]').href = MP_ROOT + 'favicon.ico';
  })();
</script>

<script>
  // Contact endpoint/payload, available before WASM
  // starts and after a panic. Nothing is sent until the user clicks Envoyer.
  window.mpSendContact = async ({type = 'bug', message, contact = ''}) => {
    let deviceId = 'rust-web';
    try { deviceId = localStorage.getItem('app_device_id') || deviceId; } catch (_) {}
    const response = await fetch('https://polocrafting.fr/contact_save.php', {
      method: 'POST', headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify({appTitle: 'MasterPaint (Rust)', type, message, contact,
        deviceId, timestamp: Date.now(), userAgent: navigator.userAgent}),
    });
    if (!response.ok) throw new Error('Contact HTTP ' + response.status);
    const result = await response.json();
    if (result.success !== true) throw new Error('Contact refused');
    return result;
  };
  window.mpOpenContact = () => {
    let modal = document.getElementById('mp-contact');
    if (modal) { modal.querySelector('textarea').focus(); return; }
    modal = document.createElement('div');
    modal.id = 'mp-contact';
    modal.innerHTML = `
      <form class="mp-err-card" role="dialog" aria-modal="true" aria-labelledby="mp-contact-title">
        <div class="mp-err-bar"><span id="mp-contact-title" data-mp-i18n>Signaler un bug</span><button type="button" class="mp-err-x" data-close aria-label="Fermer">✕</button></div>
        <label><span data-mp-i18n>Type</span>
          <select name="type"><option value="bug" data-mp-i18n>Bug / Erreur</option>
            <option value="idee" data-mp-i18n>Idée / Amélioration</option>
            <option value="remarque" data-mp-i18n>Remarque</option>
            <option value="autre" data-mp-i18n>Autre</option></select></label>
        <label for="mp-contact-message" data-mp-i18n>Message</label>
        <textarea id="mp-contact-message" class="mp-err-det" name="message" rows="6" required></textarea>
        <label for="mp-contact-info" data-mp-i18n>Contact (facultatif)</label>
        <input id="mp-contact-info" class="mp-err-mail" name="contact" autocomplete="email">
        <div class="mp-err-foot">
          <span class="mp-err-st" role="status" aria-live="polite"></span>
          <button type="button" data-close-foot data-mp-i18n>Annuler</button>
          <button type="submit" class="pri" data-mp-i18n>Envoyer</button>
        </div>
      </form>`;
    const before = document.activeElement;
    const close = () => {
      modal.remove();
      if (/^#contact\b/i.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
      if (before && before.isConnected) before.focus();
    };
    modal.querySelector('[data-close]').onclick = close;
    modal.querySelector('[data-close-foot]').onclick = close;
    modal.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      if (e.key === 'Tab') {
        const fields = [...modal.querySelectorAll('select,textarea,input,button')];
        if (e.shiftKey && document.activeElement === fields[0]) { e.preventDefault(); fields.at(-1).focus(); }
        else if (!e.shiftKey && document.activeElement === fields.at(-1)) { e.preventDefault(); fields[0].focus(); }
      }
    });
    modal.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const form = e.currentTarget, button = form.querySelector('[type=submit]');
      const status = form.querySelector('[role=status]');
      if (button.disabled) return;
      const message = form.elements.message.value.trim();
      if (!message) { status.textContent = mpTr("Écrivez un message"); return; }
      button.disabled = true; status.textContent = mpTr("Envoi…");
      try {
        await window.mpSendContact({type: form.elements.type.value, message, contact: form.elements.contact.value});
        status.textContent = mpTr("Envoyé, merci !"); form.elements.message.value = '';
      } catch (_) { status.textContent = mpTr("Échec de l'envoi (réseau ?)"); }
      finally { button.disabled = false; }
    };
    window.mpTranslateElements(modal);
    document.body.appendChild(modal); modal.querySelector('textarea').focus();
  };
  window.openContactModal = window.mpOpenContact;
  const contactFromHash = () => { if (/^#contact\b/i.test(location.hash)) window.mpOpenContact(); };
  window.addEventListener('hashchange', contactFromHash);
  window.addEventListener('DOMContentLoaded', contactFromHash, {once: true});
  // Fenêtre d'erreur de la page : panique du module (l'interface Slint est alors arrêtée et ne peut
  // plus rien afficher) ou d'un worker de calcul. Message + détails, « Envoyer le signalement »
  // (même adresse que Signaler un bug), « Copier », « Redémarrer la page » ; « Continuer » quand
  // l'application tourne encore (erreur d'un worker).
  (() => {
    const logs = [];
    const keep = (kind, a) => {
      logs.push(new Date().toISOString().slice(11, 19) + ' ' + kind + ' ' + a.map((x) => (x && x.stack) || String(x)).join(' ').slice(0, 400));
      if (logs.length > 30) logs.shift();
    };
    for (const k of ['error', 'warn']) {
      const f = console[k].bind(console);
      console[k] = (...a) => { keep(k, a); f(...a); };
    }
    let box = null, fatalShown = false;
    // « Attendre » : la fenêtre s'efface ; si le module n'a pas donné signe de vie (window.mpBeat,
    // écrit chaque seconde par l'application) au bout de ce délai, elle revient
    const WAIT_SECONDS = 20;
    const waitForRecovery = (card) => {
      card.style.display = 'none';
      const since = Date.now();
      const pill = document.createElement('div');
      pill.id = 'mp-wait';
      document.body.appendChild(pill);
      const tick = () => {
        const left = WAIT_SECONDS - Math.floor((Date.now() - since) / 1000);
        if (left > 0) {
          pill.textContent = mpTr("MasterPaint ne répond plus, attente…") + ' ' + left + ' s';
          setTimeout(tick, 1000);
          return;
        }
        pill.remove();
        // le module a repris : la fenêtre part, et un prochain plantage se signalera de nouveau
        if ((window.mpBeat || 0) > since) { if (box === card) box = null; card.remove(); fatalShown = false; }
        else card.style.display = '';

      tick();
    };

      if (fatalShown) return;

      const details = [String(msg), '',
        'MasterPaint ' + (window.mpVersion || '?') + ' (web)', navigator.userAgent, location.href,
        new Date().toString(), '', mpTr("— journal —"), ...logs].join('\n');
      if (box) box.remove();
      box = document.createElement('div');
      box.id = 'mp-error';
      box.innerHTML = `
        <div class="mp-err-card" role="alertdialog" aria-labelledby="mp-err-t">
          <div class="mp-err-bar"><span id="mp-err-t"></span>${fatal && !test ? '' : '<button class="mp-err-x" data-a="close" aria-label="Fermer">✕</button>'}</div>
          <p class="mp-err-txt"></p>
          <textarea class="mp-err-msg mp-err-mail" rows="3" data-mp-placeholder="Que faisiez-vous ? (facultatif)" placeholder="Que faisiez-vous ? (facultatif)"></textarea>
          <label class="mp-err-jnl"><input type="checkbox" checked> <span data-mp-i18n>Joindre le journal technique</span></label>
          <textarea class="mp-err-det" readonly></textarea>
          <input class="mp-err-mail" type="text" data-mp-placeholder="Votre e-mail ou pseudo (facultatif, pour une réponse)" placeholder="Votre e-mail ou pseudo (facultatif, pour une réponse)">
          <div class="mp-err-foot">
            <span class="mp-err-st"></span>
            <button data-a="send" class="pri" data-mp-i18n>Envoyer le signalement</button>
            <button data-a="copy" data-mp-i18n>Copier</button>
            <button data-a="reload" data-mp-i18n>Redémarrer la page</button>
            ${fatal ? '<button data-a="wait" data-mp-i18n>Attendre</button>' : ''}
            ${fatal && !test ? '' : '<button data-a="close">' + (test ? mpTr("Fermer l’essai") : mpTr("Continuer")) + '</button>'}
          </div>
        </div>`;
      box.querySelector('#mp-err-t').textContent = (fatal ? mpTr("MasterPaint s'est arrêté") : mpTr("Un calcul a échoué")) + (test ? mpTr(" (essai)") : '');
      box.querySelector('.mp-err-txt').textContent = fatal
        ? mpTr("Une erreur a arrêté l'application. Vos projets ont été sauvegardés automatiquement avant l'erreur et seront restaurés au redémarrage. Envoyez le signalement pour aider à corriger le problème.")
        : mpTr("Ce calcul a été abandonné, l'application continue. Envoyez le signalement pour aider à corriger le problème.");
      window.mpTranslateElements(box);
      box.querySelector('.mp-err-det').value = details;
      const st = box.querySelector('.mp-err-st');
      box.addEventListener('click', async (e) => {
        const a = e.target && e.target.dataset && e.target.dataset.a;
        if (a === 'reload') location.reload();
        else if (a === 'wait') waitForRecovery(box);
        else if (a === 'close') { box.remove(); box = null; }
        else if (a === 'copy') { try { await navigator.clipboard.writeText(details); st.textContent = mpTr("Copié"); } catch (_) { box.querySelector('.mp-err-det').select(); } }
        else if (a === 'send') {
          const send = e.target;
          if (send.disabled) return;
          send.disabled = true;
          st.textContent = mpTr("Envoi…");
          try {
            // une seule fois pour le serveur : le message, puis le journal s'il est coché
            const said = box.querySelector('.mp-err-msg').value.trim();
            const message = box.querySelector('.mp-err-jnl input').checked ? (said ? said + '\n\n--- Journal ---\n' : '') + details : said;
            if (!message) { st.textContent = mpTr("Écrivez un message"); send.disabled = false; return; }
            await window.mpSendContact({type: 'bug', message,
              contact: box.querySelector('input.mp-err-mail').value});
            st.textContent = mpTr("Envoyé, merci !");
          } catch (_) { st.textContent = mpTr("Échec de l'envoi (réseau ?)"); }
          finally { send.disabled = false; }
        }
      });
      document.body.appendChild(box);
    };
    // module arrêté sans passer par le panic hook (« unreachable », mémoire épuisée…)
    window.addEventListener('error', (e) => {
      const m = String((e.error && e.error.message) || e.message || '');
      if (/unreachable|RuntimeError|memory access out of bounds|Out of memory/i.test(m)) window.mpReportError(m, true);
    });

          gl.uniform1i(L.loc.blend, plan[i + 1] | 0); gl.uniform1i(L.loc.flags, flags); gl.uniform1f(L.loc.opacity, plan[i + 3]); gl.uniform1i(L.loc.auxk, plan[i + 4] | 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          cur = 1 - cur;
        }
        const R = progs.resolve; gl.useProgram(R.p);
        gl.bindFramebuffer(gl.FRAMEBUFFER, out.fb); gl.viewport(0, 0, rw, rh);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc[cur].t);
        gl.uniform1i(R.loc.acc, 0); gl.uniform4i(R.loc.u, w, h, ds, ns); gl.uniform4i(R.loc.v, x0, y0, off0, off1); gl.uniform1i(R.loc.checker, checker);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const px = new Uint8Array(rw * rh * 4);
        gl.readPixels(0, 0, rw, rh, gl.RGBA, gl.UNSIGNED_BYTE, px);
        return gl.getError() === gl.NO_ERROR ? px : null;
      },
    };
  })();
</script>
<script type="module">
  const PKG = window.MP_ROOT === './' ? './rust-app/pkg/' : './pkg/';
  // Calculs lourds hors du fil de l'interface (effets, Photo Mode Pro, RAW, décodage) : workers
  // qui chargent le même module wasm, déjà compilé (window.mpWasmModule). Deux files : 0 pour
  // les petits calculs (rendu en direct), 1 pour les longs, pour qu'ils ne retardent pas les
  // premiers. run() renvoie le résultat (tableau typé) ou null : l'application calcule alors
  // sur place.
  window.mpCompute = {
    // files : 0 calculs courts, 1 longs, 2 haute résolution du Mode Photo Pro (annulable)
    lanes: [null, null, null],
    idle: [],
    seq: 0,
    jobs: new Map(),
    fails: 0,
    worker(lane) {
      if (this.lanes[lane]) return this.lanes[lane];
      if (!window.mpWasmModule || typeof Worker === 'undefined' || this.fails > 2) return null;
      let w;
      try {
        w = new Worker(new URL(PKG + '../mp-worker.js', document.baseURI), { type: 'module' });
      } catch (e) {
        this.fails++;
        return null;
      }
      const drop = () => {
        w.terminate();
        if (this.lanes[lane] === w) this.lanes[lane] = null;
        for (const [k, j] of this.jobs) if (j.lane === lane) { this.jobs.delete(k); j.res(null); }
      };
      w.onmessage = (e) => {
        const d = e.data;
        const j = this.jobs.get(d.job);
        this.jobs.delete(d.job);
        // la mémoire d'un module wasm ne rétrécit jamais : un worker au repos est arrêté (il
        // gardait les centaines de Mo de son plus gros calcul) ; recréé au prochain calcul
        clearTimeout(this.idle[lane]);
        this.idle[lane] = setTimeout(() => {
          if (![...this.jobs.values()].some((p) => p.lane === lane) && this.lanes[lane]) {
            this.lanes[lane].terminate();
            this.lanes[lane] = null;
          }
        }, 8000);
        // panique dans le calcul : résultat vide (l'application abandonne ce calcul au lieu de le
        // refaire sur la page, où il planterait aussi) et fenêtre d'erreur avec le message
        if (j) j.res(d.dead ? new Uint8Array(0) : (d.out || null));
        if (d.dead && window.mpReportError) window.mpReportError(d.err || 'Erreur dans un calcul', false);
        // module arrêté (erreur grave dans le calcul) : un nouveau worker au prochain appel
        if (d.dead) drop();
      };
      w.onerror = (e) => {
        console.warn('[MasterPaint] worker de calcul :', e.message || e);
        this.fails++;
        drop();
      };
      w.postMessage({ type: 'init', module: window.mpWasmModule });
      this.lanes[lane] = w;
      return w;
    },
    run(msg, transfer) {
      const lane = Math.max(0, Math.min(msg.lane | 0, 2));
      // Independent pixel adjustments can use several CPU cores without shared
      // memory or copying the complete image into every worker. Spatial/global
      // effects and chromatic postprocessing keep their full-image context.
      const independent = new Set(['brightness', 'grayscale', 'invert', 'invertalpha', 'sepia', 'exposure', 'posterize', 'threshold', 'solarize', 'hsv', 'vibrance', 'temptint', 'temperature', 'colorbal', 'curves', 'levels', 'duotone', 'cmjn']);
      const budget = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1, (navigator.deviceMemory || 8) <= 4 ? 2 : 4));
      // Reserve room for input/rendering; preview and long-job pools are separate
      // so cancelling a slider preview cannot abort an export in the background.
      const count = lane === 0 ? ((navigator.hardwareConcurrency || 2) >= 6 && (navigator.deviceMemory || 8) > 4 ? Math.min(2, budget) : 1) : budget;
      const base = lane === 0 ? 7 : 3;
      // décodages en série (restauration des projets) : répartis sur les workers de la file 1
      if (msg.type === 'decode' && msg.slot != null && lane === 1) return this.dispatch(msg, transfer, base + (msg.slot % count));
      if (lane <= 1 && msg.type === 'effect' && independent.has(msg.name) && !msg.post?.length && msg.w * msg.h >= 1000000 && count > 1) {
        const rows = Math.ceil(msg.h / count), stride = msg.w * 4;
        const parts = [];
        for (let i = 0, y = 0; y < msg.h; i++, y += rows) {
          const h = Math.min(rows, msg.h - y);
          const data = msg.data.slice(y * stride, (y + h) * stride);
          parts.push(this.dispatch({...msg, h, data}, [data.buffer], base + i));
        }
        return Promise.all(parts).then(results => {
          if (results.some(p => !p)) return null;
          if (results.some(p => p.length === 0)) return new Uint8Array(0);
          const out = new Uint8Array(msg.w * msg.h * 4);
          let offset = 0;
          for (const part of results) { out.set(part, offset); offset += part.length; }
          return offset === out.length ? out : null;
        });
      }
      return this.dispatch(msg, transfer, lane);
    },
    dispatch(msg, transfer, lane) {
      const w = this.worker(lane);
      if (!w) return Promise.resolve(null);
      const job = ++this.seq;
      msg.job = job;
      return new Promise((res) => {
        this.jobs.set(job, { res, lane });
        w.postMessage(msg, transfer || []);
      });
    },
    // calculs devenus inutiles (réglage changé) : la file est arrêtée net, ses calculs en
    // attente rendent un résultat vide (ignoré) ; un worker neuf est créé au prochain appel
    cancel(lane) {
      for (const id of lane === 1 ? [1, 3, 4, 5, 6] : lane === 0 ? [0, 7, 8] : [lane]) {
        const w = this.lanes[id];
        if (!w) continue;
        w.terminate();
        this.lanes[id] = null;
        for (const [k, j] of this.jobs) if (j.lane === id) { this.jobs.delete(k); j.res(new Uint8Array(0)); }
      }
    },
  };
  // couleur d'accent et thème enregistrés (Paramètres de la version Rust)
  try {
    const s = JSON.parse(localStorage.getItem('illu_rust_settings') || '{}');
    document.documentElement.classList.toggle('dark', !!s.dark);
  } catch (e) { /* stockage indisponible */ }
  const tips = [
    mpTr("Astuce : Ctrl+F répète le dernier effet."),
    mpTr("Astuce : le bouton ƒ d’un calque applique un filtre dynamique en temps réel."),
    mpTr("Astuce : Ctrl+Maj+M ouvre les Courbes."),
    mpTr("Astuce : double-cliquez sur une jauge pour saisir la valeur au clavier."),
    mpTr("Astuce : Espace + glisser pour se déplacer sur la toile."),
  ];
  document.getElementById('tip').textContent = tips[Math.floor(Math.random() * tips.length)];
  const fill = document.getElementById('fill'), pct = document.getElementById('pct'), step = document.getElementById('step');
  const mb = (n) => (n / 1048576).toFixed(1) + mpTr(" Mo");
  // téléchargement du module avec progression (le serveur peut le compresser : taille inconnue)
  async function download(url) {
    const res = await fetch(url);
    if (!res.ok || !res.body) return url;
    const total = +res.headers.get('content-length') || 0;
    const encoded = res.headers.get('content-encoding');
    if (!total || encoded) fill.classList.add('indeterminate');
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      if (total && !encoded) {
        fill.style.width = Math.min(100, got / total * 100) + '%';
        pct.textContent = Math.round(got / total * 100) + ' % · ' + mb(got);
      } else {
        pct.textContent = mb(got);
      }
    }
    const bytes = new Uint8Array(got);
    let o = 0;
    for (const c of chunks) { bytes.set(c, o); o += c.length; }
    return bytes;
  }
  const hide = () => { document.body.classList.add('ready'); document.getElementById('loading').classList.add('done'); };
  // l'application appelle mpReady() une fois les projets de la session restaurés
  window.mpReady = hide;
  window.mpLoadingStep = (text) => { step.textContent = mpTr(text); pct.textContent = ''; fill.classList.add('indeterminate'); };
  try {
    const { default: init } = await import(PKG + 'masterpaint_ui.js');
    const bytes = await download(PKG + 'masterpaint_ui_bg.wasm');
    // compilé une fois ici, puis partagé avec les workers de calcul (aucune recompilation)
    let module = bytes;
    try {
      module = typeof bytes === 'string' ? await WebAssembly.compileStreaming(fetch(bytes)) : await WebAssembly.compile(bytes);
      window.mpWasmModule = module;
    } catch (e) {
      console.warn('[MasterPaint] compilation du module :', e);
      module = bytes;
    }
    fill.classList.remove('indeterminate');
    fill.style.width = '100%';
    step.textContent = mpTr("Démarrage de l’interface…");
    // filet de sécurité si l'application ne signale pas qu'elle est prête
    setTimeout(hide, 30000);
    await init({ module_or_path: module });
  } catch (e) {
    if (String(e).includes('Using exceptions for control flow')) {
      // boucle d'évènements lancée : l'écran disparaît à l'appel de mpReady()
    } else {
      console.error(e);
      step.textContent = mpTr("Échec du chargement"); step.classList.add("err");
      pct.textContent = '';
      document.getElementById('tip').textContent = String(e);
    }
  }
</script>
<script>
// Statistiques de visite (comme la version HTML : track.php sur polocrafting.fr). Envoyées
// seulement depuis le site en ligne (masterpaint.fr, polocrafting.fr) : rien depuis la machine
// locale (localhost, 127.0.0.1, adresse du réseau), ni en mode développement (clé
// « illu_dev_mode » partagée avec la version HTML). Identifiant d'appareil commun aux deux
// versions (« app_device_id »), page « MasterPaint Rust ».
(() => {
  const TRACK_ALLOWED_HOSTS = ['masterpaint.fr', 'www.masterpaint.fr', 'polocrafting.fr', 'www.polocrafting.fr'];
  if (TRACK_ALLOWED_HOSTS.indexOf(String(location.hostname).toLowerCase()) < 0) return;
  try { if (localStorage.getItem('illu_dev_mode') === '1') return; } catch (_) { return; }
  let deviceId = null;
  try {
    deviceId = localStorage.getItem('app_device_id');
    if (!deviceId) {
      deviceId = 'dev-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
      localStorage.setItem('app_device_id', deviceId);
    }
  } catch (_) { deviceId = 'dev-nostore'; }
  // « text/plain » : requête CORS simple (pas de préflight) ; corps JSON lu par php://input
  fetch('https://polocrafting.fr/track.php', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify({ deviceId: deviceId, page: 'MasterPaint Rust' })
  }).catch(e => console.log('Tracking error', e));
})();
</script>
