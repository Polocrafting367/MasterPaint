<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterPaint (Rust)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfcfcf; }
  /* Slint dessine toute l'interface dans ce canevas (WebGL) */
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 14px "Segoe UI", sans-serif; color: #333; }
</style>
</head>
<body>
<div id="loading">Chargement de MasterPaint…</div>
<canvas id="canvas" tabindex="0"></canvas>
<script type="module">
  import init from './pkg/masterpaint_ui.js';
  init().catch((e) => { if (!String(e).includes('Using exceptions for control flow')) console.error(e); })
        .finally(() => document.getElementById('loading').remove());
</script>
</body>
</html>
