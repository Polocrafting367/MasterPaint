# MasterPaint — © 2026 polocrafting — https://polocrafting.fr. Voir COPYRIGHT.md / See COPYRIGHT.md.
[workspace]
resolver = "2"
members = ["masterpaint-core", "masterpaint-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["polocrafting"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Version web : LTO complète et une seule unité de compilation — wasm plus petit (le code
# généré par Slint pour l'interface en est la plus grosse part), aussi rapide ou plus.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1

# En développement, les dépendances (Slint, image…) sont optimisées : l'interface reste fluide.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Backdrop blur for floating palette/dialog titles; shared by web and native builds.
[patch.crates-io]
i-slint-renderer-femtovg = { path = "vendor/slint-renderer-femtovg" }
# curseur image en chargement remplacé par un curseur standard demandé entre-temps (navigateur)
winit = { path = "vendor/winit" }
