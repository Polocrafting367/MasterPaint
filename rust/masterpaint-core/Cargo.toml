[package]
name = "masterpaint-core"
description = "Moteur d'effets pixel de MasterPaint (navigateur et bureau)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]

