# MasterPaint — © 2026 polocrafting — https://polocrafting.fr. Voir COPYRIGHT.md / See COPYRIGHT.md.
[package]
name = "masterpaint-ui"
description = "Interface native de MasterPaint (Slint) : mise en page Paint.NET, ruban / barre classique, thèmes"
version = "3.5.8"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "masterpaint-ui"
path = "src/main.rs"

[dependencies]
# fichiers Paint.NET (.pdn) : pixels en morceaux gzip (version déjà dans Cargo.lock)
flate2 = "1"
crc32fast = "1"
# APNG (PNG animé) : même version que celle tirée par `image`
png = "0.18"
masterpaint-core = { path = "../masterpaint-core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga", "qoi"] }
webbrowser = "1"
ab_glyph = "0.2"
# rendu vectoriel du mode SVG (remplissages, traits, dégradés à la résolution de l'écran) ; déjà
# dans Cargo.lock par Slint (resvg)
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# lecture des icônes SVG en pixels pour leurs teintes (dans le navigateur, Slint laisse le SVG au
# navigateur, qui ne le rend pas lisible) ; sans polices ni images : les icônes n'en ont pas
resvg = { version = "0.48", default-features = false }
# ouverture des SVG (Illustrator, Inkscape, Figma…) : CSS, <use>, texte en courbes, réécrits en
# SVG simple (même version que resvg, déjà dans Cargo.lock ; comme VectorCraft)
usvg = { version = "0.48", default-features = false, features = ["text", "writer"] }
wuff = "0.2"
ttf-parser = "0.25"
serde_json = "1"
base64 = "0.22"
# calcul des effets sur la carte graphique (Vulkan / Metal / DirectX 12, WebGPU sur le web)
wgpu = "30"
# fichiers RAW des appareils photo (ARW, CR2, CR3, NEF, ORF, RAF, RW2, DNG, PEF…) — dnglab, LGPL-2.1
rawler = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# accès à la fenêtre winit : fichiers déposés, fenêtre sans cadre (menus dans la barre de titre)
pollster = "0.4"
ureq = "2"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }
rfd = "0.15"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
# rawler → uuid : aléa du navigateur (crypto.getRandomValues)
uuid = { version = "1", features = ["js"] }
futures-channel = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Response", "Storage", "HtmlInputElement", "FileList", "File", "Location", "Request", "RequestInit", "Headers", "Navigator", "TouchEvent", "TouchList", "Touch", "AddEventListenerOptions", "console", "DragEvent", "DataTransfer", "BeforeUnloadEvent", "Event"] }
wasm-bindgen-futures = "0.4"

# tests seulement : rendu de référence des SVG (même moteur que Slint, déjà dans Cargo.lock)
[dev-dependencies]
resvg = "0.48"

[build-dependencies]
slint-build = "1.18"
# traductions compressées dans le programme (déjà une dépendance, même version)
flate2 = "1"
# icône de l'exe Windows (aussi en compilation croisée depuis Linux)
winresource = "0.1"
