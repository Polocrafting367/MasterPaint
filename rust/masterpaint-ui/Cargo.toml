[package]
name = "masterpaint-ui"
description = "Interface native de MasterPaint (Slint) : mise en page Paint.NET, ruban / barre classique, thèmes"
version = "3.3.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "masterpaint-ui"
path = "src/main.rs"

[dependencies]
masterpaint-core = { path = "../masterpaint-core" }
slint = "1.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.15"
webbrowser = "1"
ab_glyph = "0.2"
wuff = "0.2"
ttf-parser = "0.25"
serde_json = "1"
base64 = "0.22"
# calcul des effets sur la carte graphique (Vulkan / Metal / DirectX 12, WebGPU sur le web)
wgpu = "30"
# fichiers RAW des appareils photo (ARW, CR2, CR3, NEF, ORF, RAF, RW2, DNG, PEF…) — dnglab, LGPL-2.1
rawler = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# accès à la fenêtre winit : fichiers déposés, fenêtre sans cadre (menus dans la barre de titre)
slint = { version = "1.18", features = ["unstable-winit-030"] }
pollster = "0.4"
arboard = { version = "3", default-features = false, features = ["image-data"] }
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rawler → uuid : aléa du navigateur (crypto.getRandomValues)
uuid = { version = "1", features = ["js"] }
futures-channel = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Response", "Storage", "HtmlInputElement", "FileList", "File", "Location", "Request", "RequestInit", "Headers", "Navigator", "TouchEvent", "TouchList", "Touch", "AddEventListenerOptions", "console", "DragEvent", "DataTransfer", "BeforeUnloadEvent", "Event"] }
wasm-bindgen-futures = "0.4"

[build-dependencies]
slint-build = "1.18"
# icône de l'exe Windows (aussi en compilation croisée depuis Linux)
winresource = "0.1"
