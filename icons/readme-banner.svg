<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Logo Gradients -->
    <linearGradient id="EarL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#227fdc" />
      <stop offset="100%" stop-color="#00f4e1" />
    </linearGradient>
    <linearGradient id="EarR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2d51e9" />
      <stop offset="100%" stop-color="#00f4e1" />
    </linearGradient>
    <linearGradient id="FaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0489cf" />
      <stop offset="100%" stop-color="#11adeb" />
    </linearGradient>
    <linearGradient id="FaceR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#227fdc" />
      <stop offset="100%" stop-color="#2d51e9" />
    </linearGradient>
    <linearGradient id="OrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe8511" />
      <stop offset="100%" stop-color="#ffb03a" />
    </linearGradient>

    <!-- Titlebar Gradient -->
    <linearGradient id="TitleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2d5c" />
      <stop offset="100%" stop-color="#3d6dad" />
    </linearGradient>
  </defs>

  <!-- Background Workspace Teal (#0d7a7a) -->
  <rect width="800" height="450" fill="#0d7a7a" />

  <!-- ================= MASTERPAINT APP WINDOW (Win98 3D Bevel) ================= -->
  <!-- Outer Window Border & Body -->
  <rect x="20" y="20" width="760" height="410" fill="#ebe8e4" />
  <!-- Outer Raised Border (White top-left, dark-grey/black bottom-right) -->
  <path d="M 20 430 V 20 H 780" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M 20 430 H 780 V 20" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="square" />
  <path d="M 21 428 H 778 V 21" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="square" />

  <!-- 1. Active Title Bar -->
  <rect x="25" y="25" width="750" height="24" fill="url(#TitleBarGrad)" />
  <text x="35" y="42" fill="#ffffff" font-family="'Segoe UI', 'MS Sans Serif', Tahoma, sans-serif" font-size="13" font-weight="bold">MasterPaint — [LynxLogo.illu]</text>
  
  <!-- Titlebar Buttons (Win98 Style) -->
  <!-- Minimize Button -->
  <g transform="translate(695, 28)">
    <rect width="18" height="18" fill="#ebe8e4" stroke="#8a8a8a" stroke-width="1" />
    <path d="M 0 18 H 18 V 0" stroke="#0a0a0a" stroke-width="1" />
    <path d="M 0 0 H 18 V 18" stroke="#ffffff" stroke-width="1" />
    <line x1="4" y1="13" x2="10" y2="13" stroke="#000000" stroke-width="2" />
  </g>
  <!-- Maximize Button -->
  <g transform="translate(717, 28)">
    <rect width="18" height="18" fill="#ebe8e4" stroke="#8a8a8a" stroke-width="1" />
    <path d="M 0 18 H 18 V 0" stroke="#0a0a0a" stroke-width="1" />
    <path d="M 0 0 H 18 V 18" stroke="#ffffff" stroke-width="1" />
    <rect x="4" y="4" width="10" height="9" fill="none" stroke="#000000" stroke-width="1" />
    <line x1="4" y1="5" x2="14" y2="5" stroke="#000000" stroke-width="2" />
  </g>
  <!-- Close Button (Red Accent / Win98 hybrid) -->
  <g transform="translate(739, 28)">
    <rect width="18" height="18" fill="#ebe8e4" stroke="#8a8a8a" stroke-width="1" />
    <path d="M 0 18 H 18 V 0" stroke="#0a0a0a" stroke-width="1" />
    <path d="M 0 0 H 18 V 18" stroke="#ffffff" stroke-width="1" />
    <path d="M 5 5 L 13 13 M 13 5 L 5 13" stroke="#000000" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 2. Menu Bar -->
  <rect x="25" y="50" width="750" height="22" fill="#ebe8e4" />
  <text x="35" y="65" fill="#1a1a1a" font-family="'Segoe UI', sans-serif" font-size="12">Fichier   Édition   Affichage   Image   Calques   Effets   Ajustements   Aide</text>
  <line x1="25" y1="72" x2="775" y2="72" stroke="#8a8a8a" stroke-width="1" />
  <line x1="25" y1="73" x2="775" y2="73" stroke="#ffffff" stroke-width="1" />

  <!-- 3. Tool Options Ribbon / Ribbon type MS Office -->
  <rect x="25" y="74" width="750" height="34" fill="#ebe8e4" />
  <!-- Small tools indicator / active settings -->
  <text x="35" y="95" fill="#555555" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Outil actif :</text>
  <!-- Active tool badge -->
  <rect x="105" y="80" width="115" height="22" fill="#ffffff" stroke="#7a7a7a" stroke-width="1" />
  <text x="120" y="95" fill="#1a1a1a" font-family="'Segoe UI', sans-serif" font-size="11">🎨 Pinceau Vectoriel</text>
  <!-- Stroke/Width indicator -->
  <text x="235" y="95" fill="#555555" font-family="'Segoe UI', sans-serif" font-size="11">Taille :</text>
  <rect x="275" y="80" width="40" height="22" fill="#ffffff" stroke="#7a7a7a" stroke-width="1" />
  <text x="285" y="95" fill="#1a1a1a" font-family="'Segoe UI', sans-serif" font-size="11">12 px</text>
  <!-- Remplissage indicator -->
  <text x="330" y="95" fill="#555555" font-family="'Segoe UI', sans-serif" font-size="11">Remplir :</text>
  <rect x="380" y="80" width="90" height="22" fill="#ffffff" stroke="#7a7a7a" stroke-width="1" />
  <text x="390" y="95" fill="#1a1a1a" font-family="'Segoe UI', sans-serif" font-size="11">Uni [Vecteur]</text>
  
  <line x1="25" y1="108" x2="775" y2="108" stroke="#8a8a8a" stroke-width="1" />
  <line x1="25" y1="109" x2="775" y2="109" stroke="#ffffff" stroke-width="1" />

  <!-- 4. Inner Editor Workspace Area (#9aa3b0) -->
  <rect x="25" y="110" width="750" height="315" fill="#9aa3b0" />
  <path d="M 25 110 H 775 V 425 H 25 Z" fill="none" stroke="#7a7a7a" stroke-width="1" />

  <!-- Left Sidebar Panel: Outils (Win98 Style Float Window) -->
  <g transform="translate(32, 118)">
    <rect width="60" height="298" fill="#ebe8e4" stroke="#8a8a8a" stroke-width="1" />
    <!-- 3D Bevel for tools sidebar -->
    <path d="M 0 298 V 0 H 60" fill="none" stroke="#ffffff" stroke-width="1" />
    <path d="M 0 298 H 60 V 0" stroke="#0a0a0a" stroke-width="1" fill="none" />
    <!-- Titlebar panel -->
    <rect x="3" y="3" width="54" height="15" fill="#0f2d5c" />
    <text x="6" y="14" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Outils</text>

    <!-- Grid of Tool Buttons (8 rows x 2 cols) -->
    <!-- Tool 1 & 2 -->
    <rect x="5" y="24" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 5 47 H 28 V 24" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="10" y="40" font-size="12">🔍</text>

    <rect x="32" y="24" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 32 47 H 55 V 24" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="37" y="40" font-size="12">✏️</text>

    <!-- Tool 3 & 4 (Active Pinceau tool: Inset pressed down look) -->
    <rect x="5" y="50" width="23" height="23" fill="#ddd9d4" stroke="#7a7a7a" stroke-width="1" />
    <path d="M 5 73 H 28 V 50" stroke="#ffffff" stroke-width="1" fill="none"/>
    <text x="10" y="66" font-size="12">🖌️</text>

    <rect x="32" y="50" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 32 73 H 55 V 50" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="37" y="66" font-size="12">🪣</text>

    <!-- Tool 5 & 6 -->
    <rect x="5" y="76" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 5 99 H 28 V 76" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="10" y="92" font-size="12">🧽</text>

    <rect x="32" y="76" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 32 99 H 55 V 76" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="37" y="92" font-size="12">📐</text>

    <!-- Tool 7 & 8 -->
    <rect x="5" y="102" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 5 125 H 28 V 102" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="10" y="118" font-size="12">📏</text>

    <rect x="32" y="102" width="23" height="23" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 32 125 H 55 V 102" stroke="#8a8a8a" stroke-width="1" fill="none"/>
    <text x="37" y="118" font-size="12">⭐</text>
  </g>

  <!-- Right Sidebar Panel: Calques (Layers) -->
  <g transform="translate(630, 118)">
    <rect width="138" height="298" fill="#ebe8e4" stroke="#8a8a8a" stroke-width="1" />
    <path d="M 0 298 V 0 H 138" fill="none" stroke="#ffffff" stroke-width="1" />
    <path d="M 0 298 H 138 V 0" stroke="#0a0a0a" stroke-width="1" fill="none" />
    
    <!-- Titlebar panel -->
    <rect x="3" y="3" width="132" height="15" fill="#0f2d5c" />
    <text x="6" y="14" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Calques</text>

    <!-- List box (Inset look) -->
    <rect x="5" y="24" width="128" height="240" fill="#ffffff" stroke="#7a7a7a" stroke-width="1" />
    <path d="M 5 264 H 133 V 24" stroke="#fafafa" stroke-width="1" fill="none" />
    
    <!-- Layer Item 1 (Active) -->
    <rect x="7" y="26" width="124" height="24" fill="#0f2d5c" />
    <text x="12" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Calque 1 (Art) [Vecteur]</text>
    
    <!-- Layer Item 2 -->
    <rect x="7" y="52" width="124" height="24" fill="#ffffff" />
    <text x="12" y="68" fill="#1a1a1a" font-family="'Segoe UI', sans-serif" font-size="10">Arrière-plan [Pixel]</text>

    <!-- Bottom Actions buttons -->
    <rect x="5" y="270" width="22" height="22" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 5 292 H 27 V 270" stroke="#8a8a8a" stroke-width="1" fill="none" />
    <text x="11" y="285" font-size="10">+</text>

    <rect x="30" y="270" width="22" height="22" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 30 292 H 52 V 270" stroke="#8a8a8a" stroke-width="1" fill="none" />
    <text x="37" y="285" font-size="10">x</text>

    <rect x="55" y="270" width="22" height="22" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 55 292 H 77 V 270" stroke="#8a8a8a" stroke-width="1" fill="none" />
    <text x="61" y="285" font-size="10">↑</text>
    
    <rect x="80" y="270" width="22" height="22" fill="#ebe8e4" stroke="#ffffff" stroke-width="1" />
    <path d="M 80 292 H 102 V 270" stroke="#8a8a8a" stroke-width="1" fill="none" />
    <text x="86" y="285" font-size="10">↓</text>
  </g>

  <!-- ================= CENTRAL ARTWORK CANVAS (The Lynx Design) ================= -->
  <g transform="translate(180, 125)">
    <!-- Canvas Frame (White with Grey Inset Bevel) -->
    <rect width="360" height="280" fill="#ffffff" stroke="#7a7a7a" stroke-width="2" />
    <!-- Classic grid transparent checkerboard simulation in vector background -->
    <g fill="#f3f4f6" opacity="0.45">
      <rect x="0" y="0" width="20" height="20"/><rect x="40" y="0" width="20" height="20"/><rect x="80" y="0" width="20" height="20"/><rect x="120" y="0" width="20" height="20"/><rect x="160" y="0" width="20" height="20"/><rect x="200" y="0" width="20" height="20"/><rect x="240" y="0" width="20" height="20"/><rect x="280" y="0" width="20" height="20"/><rect x="320" y="0" width="20" height="20"/>
      <rect x="20" y="20" width="20" height="20"/><rect x="60" y="20" width="20" height="20"/><rect x="100" y="20" width="20" height="20"/><rect x="140" y="20" width="20" height="20"/><rect x="180" y="20" width="20" height="20"/><rect x="220" y="20" width="20" height="20"/><rect x="260" y="20" width="20" height="20"/><rect x="300" y="20" width="20" height="20"/><rect x="340" y="20" width="20" height="20"/>
      <rect x="0" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="80" y="40" width="20" height="20"/><rect x="120" y="40" width="20" height="20"/><rect x="160" y="40" width="20" height="20"/><rect x="200" y="40" width="20" height="20"/><rect x="240" y="40" width="20" height="20"/><rect x="280" y="40" width="20" height="20"/><rect x="320" y="40" width="20" height="20"/>
      <!-- (Repeated to simulate checkers) -->
      <rect x="20" y="60" width="20" height="20"/><rect x="60" y="60" width="20" height="20"/><rect x="100" y="60" width="20" height="20"/><rect x="140" y="60" width="20" height="20"/><rect x="180" y="60" width="20" height="20"/><rect x="220" y="60" width="20" height="20"/><rect x="260" y="60" width="20" height="20"/><rect x="300" y="60" width="20" height="20"/><rect x="340" y="60" width="20" height="20"/>
      <rect x="0" y="80" width="20" height="20"/><rect x="40" y="80" width="20" height="20"/><rect x="80" y="80" width="20" height="20"/><rect x="120" y="80" width="20" height="20"/><rect x="160" y="80" width="20" height="20"/><rect x="200" y="80" width="20" height="20"/><rect x="240" y="80" width="20" height="20"/><rect x="280" y="80" width="20" height="20"/><rect x="320" y="80" width="20" height="20"/>
      <rect x="20" y="100" width="20" height="20"/><rect x="60" y="100" width="20" height="20"/><rect x="100" y="100" width="20" height="20"/><rect x="140" y="100" width="20" height="20"/><rect x="180" y="100" width="20" height="20"/><rect x="220" y="100" width="20" height="20"/><rect x="260" y="100" width="20" height="20"/><rect x="300" y="100" width="20" height="20"/><rect x="340" y="100" width="20" height="20"/>
      <rect x="0" y="120" width="20" height="20"/><rect x="40" y="120" width="20" height="20"/><rect x="80" y="120" width="20" height="20"/><rect x="120" y="120" width="20" height="20"/><rect x="160" y="120" width="20" height="20"/><rect x="200" y="120" width="20" height="20"/><rect x="240" y="120" width="20" height="20"/><rect x="280" y="120" width="20" height="20"/><rect x="320" y="120" width="20" height="20"/>
      <rect x="20" y="140" width="20" height="20"/><rect x="60" y="140" width="20" height="20"/><rect x="100" y="140" width="20" height="20"/><rect x="140" y="140" width="20" height="20"/><rect x="180" y="140" width="20" height="20"/><rect x="220" y="140" width="20" height="20"/><rect x="260" y="140" width="20" height="20"/><rect x="300" y="140" width="20" height="20"/><rect x="340" y="140" width="20" height="20"/>
      <rect x="0" y="160" width="20" height="20"/><rect x="40" y="160" width="20" height="20"/><rect x="80" y="160" width="20" height="20"/><rect x="120" y="160" width="20" height="20"/><rect x="160" y="160" width="20" height="20"/><rect x="200" y="160" width="20" height="20"/><rect x="240" y="160" width="20" height="20"/><rect x="280" y="160" width="20" height="20"/><rect x="320" y="160" width="20" height="20"/>
      <rect x="20" y="180" width="20" height="20"/><rect x="60" y="180" width="20" height="20"/><rect x="100" y="180" width="20" height="20"/><rect x="140" y="180" width="20" height="20"/><rect x="180" y="180" width="20" height="20"/><rect x="220" y="180" width="20" height="20"/><rect x="260" y="180" width="20" height="20"/><rect x="300" y="180" width="20" height="20"/><rect x="340" y="180" width="20" height="20"/>
      <rect x="0" y="200" width="20" height="20"/><rect x="40" y="200" width="20" height="20"/><rect x="80" y="200" width="20" height="20"/><rect x="120" y="200" width="20" height="20"/><rect x="160" y="200" width="20" height="20"/><rect x="200" y="200" width="20" height="20"/><rect x="240" y="200" width="20" height="20"/><rect x="280" y="200" width="20" height="20"/><rect x="320" y="200" width="20" height="20"/>
      <rect x="20" y="220" width="20" height="20"/><rect x="60" y="220" width="20" height="20"/><rect x="100" y="220" width="20" height="20"/><rect x="140" y="220" width="20" height="20"/><rect x="180" y="220" width="20" height="20"/><rect x="220" y="220" width="20" height="20"/><rect x="260" y="220" width="20" height="20"/><rect x="300" y="220" width="20" height="20"/><rect x="340" y="220" width="20" height="20"/>
      <rect x="0" y="240" width="20" height="20"/><rect x="40" y="240" width="20" height="20"/><rect x="80" y="240" width="20" height="20"/><rect x="120" y="240" width="20" height="20"/><rect x="160" y="240" width="20" height="20"/><rect x="200" y="240" width="20" height="20"/><rect x="240" y="240" width="20" height="20"/><rect x="280" y="240" width="20" height="20"/><rect x="320" y="240" width="20" height="20"/>
      <rect x="20" y="260" width="20" height="20"/><rect x="60" y="260" width="20" height="20"/><rect x="100" y="260" width="20" height="20"/><rect x="140" y="260" width="20" height="20"/><rect x="180" y="260" width="20" height="20"/><rect x="220" y="260" width="20" height="20"/><rect x="260" y="260" width="20" height="20"/><rect x="300" y="260" width="20" height="20"/><rect x="340" y="260" width="20" height="20"/>
    </g>

    <!-- Drawn Geometric Lynx Artwork (Centered in canvas) -->
    <g transform="translate(68, 25) scale(0.44)">
      <!-- Card background rounded -->
      <rect x="12" y="12" width="488" height="488" rx="130" fill="#1b0134" stroke="#2f0458" stroke-width="8" />

      <!-- Ears -->
      <polygon points="120,220 220,200 80,60" fill="url(#EarL)" />
      <polygon points="140,205 205,193 100,90" fill="#ffffff" opacity="0.3" />
      <polygon points="80,60 70,68 40,15 55,10" fill="#00f4e1" />

      <polygon points="392,220 292,200 432,60" fill="url(#EarR)" />
      <polygon points="372,205 307,193 412,90" fill="#ffffff" opacity="0.3" />
      <polygon points="432,60 442,68 472,15 457,10" fill="#00f4e1" />

      <!-- Cheeks -->
      <polygon points="120,220 220,200 256,310 100,320" fill="url(#FaceL)" />
      <polygon points="392,220 292,200 256,310 412,320" fill="url(#FaceR)" />

      <!-- Forehead -->
      <polygon points="220,200 292,200 256,310" fill="#17adeb" />
      <polygon points="220,200 256,310 180,300" fill="#0489cf" opacity="0.5" />
      <polygon points="292,200 256,310 332,300" fill="#2d51e9" opacity="0.5" />

      <!-- Muzzle -->
      <polygon points="100,320 210,320 180,390" fill="url(#OrangeGrad)" />
      <polygon points="412,320 302,320 332,390" fill="url(#OrangeGrad)" />

      <!-- Nose -->
      <polygon points="210,320 302,320 256,375" fill="#ffffff" />
      <polygon points="240,375 272,375 256,400" fill="#1b0134" />
      <polygon points="180,390 332,390 256,460" fill="url(#OrangeGrad)" />

      <!-- Eyes -->
      <polygon points="150,265 220,265 190,290" fill="#00ffff" stroke="#12246c" stroke-width="4" />
      <polygon points="362,265 292,265 322,290" fill="#00ffff" stroke="#12246c" stroke-width="4" />
      <polygon points="145,255 225,255 190,242" fill="#ffffff" />
      <polygon points="367,255 287,255 322,242" fill="#ffffff" />
    </g>

    <!-- Brush outline active tool cursor indicator (shows precision) -->
    <circle cx="180" cy="140" r="12" fill="none" stroke="#fe8511" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M 180 123 V 131 M 180 149 V 157 M 163 140 H 171 M 189 140 H 197" fill="none" stroke="#fe8511" stroke-width="1.5" />
  </g>
</svg>
