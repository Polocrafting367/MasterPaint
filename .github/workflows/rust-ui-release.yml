# Applications de bureau de la version Rust (Slint) : Windows (exe portable), Linux (AppImage
# + archive), macOS (dmg universel Intel + Apple Silicon). Rendu de l'interface par OpenGL
# (femtovg) : accélération graphique sur les trois systèmes.
#
# Lancement : un tag « v* » (ex. v3.1.0) ou manuellement depuis l'onglet Actions. Les fichiers
# produits sont joints à la release du tag, ou téléchargeables comme artefacts du lancement.
# Noms attendus par la page /downloads/ (download_url dans masterpaint-ui/src/lib.rs).
name: Version Rust — bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation
        run: cargo build -p masterpaint-ui --release
      - name: Paquet
        shell: bash
        run: |
          ver=$(grep -m1 '^version' masterpaint-ui/Cargo.toml | cut -d'"' -f2)
          mkdir -p ../dist
          cp target/release/masterpaint-ui.exe "../dist/MasterPaint-${ver}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques système (fenêtrage X11 / Wayland, polices, boîtes de dialogue)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation
        run: cargo build -p masterpaint-ui --release
      - name: AppImage et archive
        run: |
          ver=$(grep -m1 '^version' masterpaint-ui/Cargo.toml | cut -d'"' -f2)
          mkdir -p ../dist
          strip target/release/masterpaint-ui
          tar -C target/release -czf "../dist/MasterPaint_${ver}_linux_x86_64.tar.gz" masterpaint-ui
          app=MasterPaint.AppDir
          mkdir -p $app/usr/bin $app/usr/share/icons/hicolor/128x128/apps
          cp target/release/masterpaint-ui $app/usr/bin/masterpaint
          cp desktop/icons/128x128.png $app/usr/share/icons/hicolor/128x128/apps/fr.masterpaint.app.png
          cp desktop/icons/128x128.png $app/fr.masterpaint.app.png
          sed -e 's/^Exec=.*/Exec=masterpaint %F/' -e 's/^StartupWMClass=.*/StartupWMClass=masterpaint/' \
            desktop/flatpak/fr.masterpaint.app.desktop > $app/fr.masterpaint.app.desktop
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/masterpaint" "$@"\n' > $app/AppRun
          chmod +x $app/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage $app "../dist/MasterPaint_${ver}_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation (Apple Silicon et Intel)
        run: |
          cargo build -p masterpaint-ui --release --target aarch64-apple-darwin
          cargo build -p masterpaint-ui --release --target x86_64-apple-darwin
      - name: Application et dmg universels
        run: |
          ver=$(grep -m1 '^version' masterpaint-ui/Cargo.toml | cut -d'"' -f2)
          app=MasterPaint.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources ../dist
          lipo -create -output $app/Contents/MacOS/MasterPaint \
            target/aarch64-apple-darwin/release/masterpaint-ui target/x86_64-apple-darwin/release/masterpaint-ui
          cp desktop/icons/icon.icns $app/Contents/Resources/MasterPaint.icns
          cat > $app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MasterPaint</string>
            <key>CFBundleDisplayName</key><string>MasterPaint</string>
            <key>CFBundleIdentifier</key><string>fr.masterpaint.app</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundleExecutable</key><string>MasterPaint</string>
            <key>CFBundleIconFile</key><string>MasterPaint</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # signature ad hoc : nécessaire sur Apple Silicon (sans compte développeur, macOS
          # demandera d'autoriser l'application au premier lancement)
          codesign --force --deep --sign - $app
          hdiutil create -volname MasterPaint -srcfolder $app -ov -format UDZO "../dist/MasterPaint_${ver}_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
